<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FUNBOX 戰鬥陀螺抽選整理</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:#f5f6f8;color:#111}
header{height:64px;background:#111;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.title{font-size:17px;font-weight:800}
.sub{font-size:12px;color:#bbb;margin-top:2px}
.actions{display:flex;gap:8px}
button,a.btn{border:0;border-radius:10px;padding:10px 12px;font-weight:700;text-decoration:none;cursor:pointer}
.refresh{background:#fff;color:#111}
.source{background:#2d2d2d;color:#fff}
.notice{padding:9px 12px;background:#fff3cd;color:#664d03;font-size:13px;border-bottom:1px solid #eadca6}
iframe{width:100%;height:calc(100vh - 105px);border:0;background:#fff}
</style>
</head>
<body>
<header>
  <div>
    <div class="title">🔥 FUNBOX 戰鬥陀螺抽選整理</div>
    <div class="sub">2026/09/18 第一版｜手機直接點抽選</div>
  </div>
  <div class="actions">
    <button class="refresh" onclick="document.getElementById('page').src=document.getElementById('page').src">重新整理</button>
  </div>
</header>
<div class="notice">
第一版先直接載入目前可公開取得、且今天仍在更新的抽選彙整頁，方便你立即測試手機操作。之後可再改成我們自己的「地區 → 店家 → 商品 → 立即抽選」資料頁。
</div>
<iframe id="page" src="https://uxux11.github.io/funbox-line/" allow="clipboard-read; clipboard-write"></iframe>
</body>
</html>
